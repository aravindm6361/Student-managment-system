<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <div class="container">
    <h2>student registration</h2>
    <form id="studentform">
        <input type="text" id="name" placeholder="Enter the name"><br><br>
        <input type="email" id="email" placeholder="Enter the email"><br><br>
        <input type="number" id="age" placeholder="Enter the age"><br><br>
        <input type="text" id="Course" placeholder="Enter the Course"><br><br>
        <button type="submit">Register</button>
    </form>
    </div>
    <p id="message"></p>
    <h3>Registered Students</h3>
    <table border="1" id="studentTable">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Course</th>
        </tr>
    </table>
    <script src="script.js"></script>
</body>
</html>
